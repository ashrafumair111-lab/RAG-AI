<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img"
     aria-label="RAGent — Hybrid RAG and Agentic AI Assistant">
  <title>RAGent — Hybrid RAG &amp; Agentic AI Assistant</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0e1a2c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="260" rx="22" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="48" y="48" width="220" height="220" rx="110" fill="url(#glow)"/>
  <rect x="932" y="48" width="220" height="220" rx="110" fill="url(#glow)"/>

  <g font-family="'Cascadia Code','Segoe UI Mono',Consolas,'Liberation Mono',Menlo,monospace">

    <!-- ── Title: "RAGent" typed letter by letter ── -->
    <g font-size="78" font-weight="700">
      <text x="80"  y="132" fill="url(#titleGrad)">R<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.30s" fill="freeze"/></text>
      <text x="127" y="132" fill="url(#titleGrad)">A<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.48s" fill="freeze"/></text>
      <text x="174" y="132" fill="url(#titleGrad)">G<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.66s" fill="freeze"/></text>
      <text x="221" y="132" fill="url(#titleGrad)">e<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.84s" fill="freeze"/></text>
      <text x="268" y="132" fill="url(#titleGrad)">n<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.02s" fill="freeze"/></text>
      <text x="315" y="132" fill="url(#titleGrad)">t<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.20s" fill="freeze"/></text>
    </g>

    <!-- blinking cursor -->
    <text x="372" y="132" font-size="78" fill="#22d3ee">▌
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="1.35s" repeatCount="indefinite"/>
    </text>

    <!-- ── Taglines: every word appears one after the other (13s loop) ── -->
    <g font-size="26" fill="#94a3b8">
      <!-- line 1 · Hybrid Retrieval-Augmented Generation -->
      <text x="80"  y="182">Hybrid<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.34;0.36;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="189" y="182">Retrieval-Augmented<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.18;0.36;0.38;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="517" y="182">Generation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.38;0.40;1" dur="13s" repeatCount="indefinite"/></text>

      <!-- line 2 · Agentic AI Research Assistant -->
      <text x="80"  y="182">Agentic<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.60;0.62;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="205" y="182">AI<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.48;0.62;0.64;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="252" y="182">Research<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.64;0.66;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="392" y="182">Assistant<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.66;0.68;1" dur="13s" repeatCount="indefinite"/></text>

      <!-- line 3 · Documents • Web • Reasoning -->
      <text x="80"  y="182">Documents<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.72;0.88;0.90;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="236" y="182">•<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.76;0.90;0.92;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="267" y="182">Web<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.80;0.92;0.94;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="329" y="182">•<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.82;0.84;0.94;0.96;1" dur="13s" repeatCount="indefinite"/></text>
      <text x="360" y="182">Reasoning<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.86;0.88;0.96;0.98;1" dur="13s" repeatCount="indefinite"/></text>
    </g>

    <!-- footer -->
    <text x="80" y="228" font-size="14" fill="#475569">v1.0.0 · Hybrid RAG · LangGraph · Groq · Cohere · Qdrant · Tavily · MongoDB
      <animate attributeName="opacity" from="0" to="0.85" dur="0.8s" begin="3.0s" fill="freeze"/>
    </text>
  </g>
</svg>